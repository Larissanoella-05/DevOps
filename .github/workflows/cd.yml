name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  # A reusable workflow's nested jobs can only be granted a subset of what
  # the caller allows. ci.yml's build-and-test job needs packages: write to
  # push to GHCR, so it must be granted here too, or GitHub rejects the
  # whole workflow at parse time (this was the actual cause of every CD run
  # ending in startup_failure with zero jobs created).
  packages: write

env:
  IMAGE_NAME: agripulse
  IMAGE_TAG: ${{ github.sha }}

jobs:

  #  Step 1: Run all CI checks 
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  #  Steps 2 & 3: Build and push image to Azure ACR 
  build-and-push:
    name: Build & Push Image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 4: Authenticate to Azure 
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Set image output
        id: set-image
        run: |
          echo "image=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  # Step 5: Deploy via Ansible through bastion
  deploy:
    name: Deploy via Ansible
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: agripulse-dev-rg
      NSG_NAME: agripulse-dev-bastion-nsg
      TEMP_RULE_NAME: allow-cd-runner-temp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The bastion NSG only allows SSH from a few named admin IPs
      # (terraform/terraform.tfvars: ssh_ingress_cidrs) -- deliberately, so
      # SSH isn't open to the whole internet. GitHub-hosted runners use a
      # different IP every run, so without this, every CD deploy would be
      # blocked at the network level before Ansible ever gets a chance to
      # connect. This opens the door for just this one runner's IP, and the
      # cleanup step at the end (which runs even if the deploy fails) closes
      # it again immediately after.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow this runner's IP through the bastion NSG
        run: |
          RUNNER_IP="$(curl -s -4 https://api.ipify.org)/32"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

          # az CLI on this runner has hit a genuine upstream bug: a Python
          # import deadlock inside MSAL's lazy "import requests" from a
          # background credential-polling thread
          # (_frozen_importlib._DeadlockError, seen on Python 3.14). Not
          # anything in our config -- it's intermittent, and retrying is
          # the accepted mitigation for this specific class of az CLI
          # flakiness rather than something we can fix on our end.
          success=false
          for attempt in 1 2 3; do
            if az network nsg rule create \
              --resource-group "$RESOURCE_GROUP" \
              --nsg-name "$NSG_NAME" \
              --name "$TEMP_RULE_NAME" \
              --priority 100 \
              --direction Inbound \
              --access Allow \
              --protocol Tcp \
              --destination-port-ranges 22 \
              --source-address-prefixes "$RUNNER_IP" \
              --output none; then
              success=true
              break
            fi
            echo "::warning::az network nsg rule create failed (attempt $attempt/3), retrying in 5s..."
            sleep 5
          done
          if [ "$success" != true ]; then
            echo "::error::az network nsg rule create failed after 3 attempts"
            exit 1
          fi

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible

      # No known_hosts pre-population here: ssh-keyscan has no "-o" flag for
      # arbitrary SSH options (only capital "-O" for keyscan-specific ones,
      # e.g. hash algorithm) -- it never supported "-o ProxyJump=..." on any
      # OpenSSH version, so that command was guaranteed to fail every time
      # (confirmed by reproducing it directly: "unknown option -- o"). It's
      # also unnecessary: ansible.cfg already sets host_key_checking = False,
      # so Ansible accepts new host keys on its own without this at all.
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # TEMPORARY diagnostic. The direct-SSH test below timed out completely
      # (pure network timeout, not an auth error) even though this exact
      # runner's IP was just allowed through the NSG. Leading theory:
      # GitHub-hosted runners don't guarantee the same outbound IP for two
      # separate connections in the same job -- the IP curl detected for the
      # NSG rule may not be the IP actually used when ssh connects moments
      # later. This re-checks the IP right before the SSH attempt and
      # compares it to $RUNNER_IP (set two steps ago) to confirm or rule
      # that out directly, instead of assuming it.
      - name: Diagnostic - re-check outbound IP, then direct SSH to bastion
        run: |
          CURRENT_IP="$(curl -s -4 https://api.ipify.org)"
          echo "RUNNER_IP used for the NSG rule: $RUNNER_IP"
          echo "Outbound IP right now:           $CURRENT_IP/32"
          if [ "$RUNNER_IP" != "$CURRENT_IP/32" ]; then
            echo "::error::IP MISMATCH -- the NSG rule allows $RUNNER_IP but this runner is now egressing as $CURRENT_IP/32. This is almost certainly the actual bug."
          else
            echo "IPs match -- ruling out the IP-instability theory."
          fi

          ssh -vvv -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/id_rsa ubuntu@${{ secrets.BASTION_IP }} 'echo BASTION_SSH_OK' \
            2>&1 | tail -80 || echo "DIRECT SSH TO BASTION FAILED (see above)"

      # GitHub Actions doesn't always reliably restore an upstream job's
      # outputs when only failed jobs are re-run (a known platform gotcha,
      # not something in our config) -- this bit us directly: a re-run left
      # needs.build-and-push.outputs.image blank, which flowed silently all
      # the way into a rendered docker-compose.yml with image: "", and only
      # surfaced ~60s later as an opaque wait_for timeout with no useful
      # logs (docker compose itself refuses to run against an empty image
      # field, so even the rescue block's log collection came back empty).
      # Failing here instead turns that into an immediate, actionable error.
      - name: Verify the built image reference before deploying
        run: |
          if [ -z "${{ needs.build-and-push.outputs.image }}" ]; then
            echo "::error::needs.build-and-push.outputs.image is empty -- refusing to deploy with a blank image reference. If this run was triggered by 'Re-run failed jobs', use 'Re-run all jobs' instead so build-and-push's outputs are regenerated rather than restored."
            exit 1
          fi
          echo "Deploying image: ${{ needs.build-and-push.outputs.image }}"

      - name: Run Ansible deploy playbook
        run: |
          # --private-key tells Ansible which key to use. inventory.ini no
          # longer hardcodes ansible_ssh_private_key_file (it used to,
          # pointing at ~/.ssh/id_ed25519) -- that inventory-level setting
          # actually takes precedence over --private-key, not the other way
          # around, which silently broke every CD deploy: id_ed25519 never
          # existed on this runner, only the id_rsa written above. Confirmed
          # via -vvv output showing the wrong IdentityFile being used, and
          # fixed by removing the hardcoded path from inventory.ini instead.
          # Still investigating a second cause -- see the diagnostic step
          # above and -vvv here.
          ansible-playbook -i inventory.ini deploy.yml -vvv \
            --private-key ~/.ssh/id_rsa \
            --extra-vars "image=${{ needs.build-and-push.outputs.image }}" \
            --extra-vars "acr_login_server=${{ secrets.ACR_LOGIN_SERVER }}" \
            --extra-vars "acr_username=${{ secrets.ACR_USERNAME }}" \
            --extra-vars "acr_password=${{ secrets.ACR_PASSWORD }}"
        working-directory: ansible

      # Runs even if the deploy above failed -- the door must not stay open
      # just because something else went wrong. Retried for the same
      # az-CLI-deadlock reason as the create step above: this cleanup must
      # not silently no-op just because it hit the same transient bug.
      - name: Remove this runner's temporary NSG rule
        if: always()
        run: |
          success=false
          for attempt in 1 2 3; do
            if az network nsg rule delete \
              --resource-group "$RESOURCE_GROUP" \
              --nsg-name "$NSG_NAME" \
              --name "$TEMP_RULE_NAME"; then
              success=true
              break
            fi
            echo "::warning::az network nsg rule delete failed (attempt $attempt/3), retrying in 5s..."
            sleep 5
          done
          if [ "$success" != true ]; then
            echo "::error::az network nsg rule delete failed after 3 attempts -- the temporary rule may still be open, check manually"
            exit 1
          fi