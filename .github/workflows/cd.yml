name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  # A reusable workflow's nested jobs can only be granted a subset of what
  # the caller allows. ci.yml's build-and-test job needs packages: write to
  # push to GHCR, so it must be granted here too, or GitHub rejects the
  # whole workflow at parse time (this was the actual cause of every CD run
  # ending in startup_failure with zero jobs created).
  packages: write

env:
  IMAGE_NAME: agripulse
  IMAGE_TAG: ${{ github.sha }}

jobs:

  #  Step 1: Run all CI checks 
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  #  Steps 2 & 3: Build and push image to Azure ACR 
  build-and-push:
    name: Build & Push Image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 4: Authenticate to Azure 
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Set image output
        id: set-image
        run: |
          echo "image=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  # Step 5: Deploy via Ansible through bastion
  deploy:
    name: Deploy via Ansible
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: agripulse-dev-rg
      NSG_NAME: agripulse-dev-bastion-nsg
      TEMP_RULE_NAME: allow-cd-runner-temp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The bastion NSG only allows SSH from a few named admin IPs
      # (terraform/terraform.tfvars: ssh_ingress_cidrs) -- deliberately, so
      # SSH isn't open to the whole internet. GitHub-hosted runners use a
      # different IP every run, so without this, every CD deploy would be
      # blocked at the network level before Ansible ever gets a chance to
      # connect. This opens the door for just this one runner's IP, and the
      # cleanup step at the end (which runs even if the deploy fails) closes
      # it again immediately after.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow this runner's IP through the bastion NSG
        run: |
          RUNNER_IP="$(curl -s https://api.ipify.org)/32"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az network nsg rule create \
            --resource-group "$RESOURCE_GROUP" \
            --nsg-name "$NSG_NAME" \
            --name "$TEMP_RULE_NAME" \
            --priority 100 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --destination-port-ranges 22 \
            --source-address-prefixes "$RUNNER_IP" \
            --output none

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible

      # No known_hosts pre-population here: ssh-keyscan has no "-o" flag for
      # arbitrary SSH options (only capital "-O" for keyscan-specific ones,
      # e.g. hash algorithm) -- it never supported "-o ProxyJump=..." on any
      # OpenSSH version, so that command was guaranteed to fail every time
      # (confirmed by reproducing it directly: "unknown option -- o"). It's
      # also unnecessary: ansible.cfg already sets host_key_checking = False,
      # so Ansible accepts new host keys on its own without this at all.
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run Ansible deploy playbook
        run: |
          # --private-key overrides whatever ansible_ssh_private_key_file
          # happens to be committed in inventory.ini (that file reflects
          # whoever last tested locally with their own key) so CD always
          # uses the key it just wrote above, regardless of that.
          ansible-playbook -i inventory.ini deploy.yml \
            --private-key ~/.ssh/id_rsa \
            --extra-vars "image=${{ needs.build-and-push.outputs.image }}" \
            --extra-vars "acr_login_server=${{ secrets.ACR_LOGIN_SERVER }}" \
            --extra-vars "acr_username=${{ secrets.ACR_USERNAME }}" \
            --extra-vars "acr_password=${{ secrets.ACR_PASSWORD }}"
        working-directory: ansible

      # Runs even if the deploy above failed -- the door must not stay open
      # just because something else went wrong.
      - name: Remove this runner's temporary NSG rule
        if: always()
        run: |
          az network nsg rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --nsg-name "$NSG_NAME" \
            --name "$TEMP_RULE_NAME"