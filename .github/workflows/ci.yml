name: CI Pipeline

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Needed to push images to GitHub Container Registry using the
    # auto-provided GITHUB_TOKEN — by default it's read-only.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0

    - name: Set up Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          Backend/package-lock.json

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix Backend

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    # GHCR requires a lowercase image name; github.repository/github.actor
    # can contain uppercase letters, so compute a safe lowercase version.
    - name: Compute lowercase image name
      run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
