name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0

    - name: Set up Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          Backend/package-lock.json

    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix Backend

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Compute lowercase image name and tags
      run: |
        IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

        TAGS="ghcr.io/$IMAGE_NAME:${{ github.sha }}"
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          # Only main updates ":latest" — that's the tag Ansible deploys.
          TAGS="$TAGS
        ghcr.io/$IMAGE_NAME:latest"
        fi
        echo "IMAGE_TAGS<<EOF" >> "$GITHUB_ENV"
        echo "$TAGS" >> "$GITHUB_ENV"
        echo "EOF" >> "$GITHUB_ENV"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_TAGS }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ── Security Scanning (added by OJ) ──────────────────────────────────────

    - name: Run dependency scan
      run: npm audit --audit-level=high --prefix Backend

    - name: Install Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    - name: Run container image scan
      run: |
        trivy image \
          --exit-code 1 \
          --severity CRITICAL \
          --skip-dirs /usr/local/lib/node_modules/npm \
          ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Run Terraform IaC scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: terraform
        soft_fail : true