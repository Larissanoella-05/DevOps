---
- name: Ensure a full application image reference was provided
  ansible.builtin.assert:
    that:
      - app_full_image is defined
      - app_full_image | length > 0
      - not app_full_image.startswith('/')
    fail_msg: >-
      app_full_image is empty or malformed ("{{ app_full_image | default('') }}").
      This usually means the "image" extra-var was blank when ansible-playbook
      ran -- check that needs.build-and-push.outputs.image was actually
      populated in cd.yml (a known gotcha after "Re-run failed jobs").
    success_msg: "Deploying image: {{ app_full_image }}"

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_service_user }}"
    group: docker
    mode: "0755"
  loop:
    - "{{ app_compose_dir }}"
    - "{{ app_data_dir }}"

- name: Write the Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: redeploy app container

- name: Log in to the private container registry
  block:
    - name: Authenticate to {{ registry_login_server }}
      community.docker.docker_login:
        registry_url: "{{ registry_login_server }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"
      no_log: true
  rescue:
    - name: Report registry login failure
      ansible.builtin.fail:
        msg: >-
          Could not log in to {{ registry_login_server }} on {{ inventory_hostname }}.
          Confirm ACR_LOGIN_SERVER, ACR_USERNAME and ACR_PASSWORD are exported in the
          environment running ansible-playbook, and that the credentials are still valid.

- name: Pull and start the application via Docker Compose
  block:
    - name: Pull the latest application image
      community.docker.docker_image:
        name: "{{ app_full_image }}"
        source: pull
      register: app_image_pull

    - name: Start (or update) the application with docker compose up -d
      community.docker.docker_compose_v2:
        project_src: "{{ app_compose_dir }}"
        state: present
        recreate: "{{ 'always' if app_image_pull.changed else 'auto' }}"

    - name: Wait for the application to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        timeout: 60
  rescue:
    - name: Collect compose logs for diagnostics
      ansible.builtin.command: docker compose -f {{ app_compose_dir }}/docker-compose.yml logs --tail=50
      register: app_compose_logs
      changed_when: false
      ignore_errors: true

    - name: Report application deployment failure
      ansible.builtin.fail:
        msg: >-
          The AgriPulse container did not start cleanly on {{ inventory_hostname }}.
          Recent logs:
          {{ app_compose_logs.stdout | default('unavailable') }}
          {{ ('stderr: ' + app_compose_logs.stderr) if app_compose_logs.stderr | default('') else '' }}
