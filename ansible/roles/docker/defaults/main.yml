---
docker_packages:
  - ca-certificates
  - curl
  - gnupg
  - apt-transport-https
  - software-properties-common
  - python3-pip

docker_apt_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

nodejs_major_version: "20"
docker_service_user: ubuntu

docker_log_max_size: "10m"
docker_log_max_file: "3"
