---
- name: Install Docker engine and prerequisites
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_apt_packages }}"
        state: present
        update_cache: true

    - name: Install Docker SDK for Python (required by community.docker modules)
      ansible.builtin.pip:
        name: docker
        state: present
        executable: pip3

    - name: Add {{ docker_service_user }} to the docker group
      ansible.builtin.user:
        name: "{{ docker_service_user }}"
        groups: docker
        append: true

    - name: Configure Docker daemon (log rotation)
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: restart docker

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
  rescue:
    - name: Report Docker installation failure
      ansible.builtin.fail:
        msg: >-
          Docker installation failed on {{ inventory_hostname }} at task
          '{{ ansible_failed_task.name }}': {{ ansible_failed_result.msg | default('see task output above') }}.
          Check apt connectivity and that the host is Ubuntu 22.04 before re-running.

- name: Check whether Node.js is already installed
  ansible.builtin.command: node --version
  register: node_version_check
  changed_when: false
  failed_when: false

- name: Add NodeSource apt repository for Node.js {{ nodejs_major_version }}.x
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_major_version }}.x | bash -
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nodesource.list
  when: "'v' + nodejs_major_version not in node_version_check.stdout"

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
