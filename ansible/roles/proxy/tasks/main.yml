---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Write the AgriPulse reverse proxy config
  ansible.builtin.template:
    src: agripulse.conf.j2
    dest: /etc/nginx/sites-available/agripulse.conf
    mode: "0644"
  notify: reload nginx

- name: Enable the AgriPulse site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/agripulse.conf
    dest: /etc/nginx/sites-enabled/agripulse.conf
    state: link
  notify: reload nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
