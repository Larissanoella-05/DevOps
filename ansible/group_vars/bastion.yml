---
# Private IP of the app VM, resolved from whichever host Ansible finds in the
# [app] inventory group — same trick app.yml uses for ProxyJump, so nothing
# needs to be typed in by hand for either the static or dynamic inventory.
# ansible_host falls back to inventory_hostname because the static inventory
# names hosts by IP directly and never sets ansible_host as a real hostvar.
app_upstream_host: >-
  {{ hostvars[groups['app'][0]].ansible_host
  | default(hostvars[groups['app'][0]].inventory_hostname) }}

firewall_rules:
  - port: "{{ ssh_port }}"
  - port: "80"
  - port: "443"

# nip.io maps "<ip>.nip.io" straight back to that IP, no DNS setup or
# purchased domain needed -- just enough for Let's Encrypt to issue a real,
# browser-trusted certificate against a hostname. Recomputes automatically
# if the bastion is ever recreated with a new IP; the old cert for the old
# hostname is simply abandoned, and a fresh one is issued for the new one.
bastion_hostname: "{{ ansible_host | default(inventory_hostname) }}.nip.io"

# Required by Let's Encrypt for renewal/expiry notices. Doesn't need to be a
# monitored inbox, but the domain part must end in a real public TLD --
# Let's Encrypt validates against the public suffix list (rejects reserved
# ones like .example, .test, .invalid), it just doesn't check deliverability.
letsencrypt_email: "devops@agripulse.com"
