---
app_name: agripulse
app_container_name: agripulse
app_port: 3000
app_host_port: 3000

app_deploy_method: pull
# The image CI builds, scans (Trivy), and pushes to GHCR on every merge to main —
# keeps the deployed image tied to what the pipeline actually built and checked.
app_registry_image: "ghcr.io/larissanoella-05/devops:latest"
app_image_tar_src: "../agripulse-image.tar"
app_image: "agripulse:latest"

app_data_dir: /opt/agripulse/data
app_env_dir: /opt/agripulse
app_restart_policy: unless-stopped

app_env:
  NODE_ENV: production
  PORT: "{{ app_port }}"
  DB_PATH: /app/data/agripulse.db

ssh_port: 22
firewall_allowed_ports:
  - "{{ ssh_port }}"
  - "{{ app_port }}"
